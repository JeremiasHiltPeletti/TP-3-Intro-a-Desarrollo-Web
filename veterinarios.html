<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinarios - Veterinaria Huellitas</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons (Para mejorar el aspecto visual) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" href="./css/bases.css">
    <link rel="stylesheet" href="./css/estilos.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- NAV BAR -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark navbar-huellitas">
        <div class="container-fluid">

            <a class="navbar-brand Logo" href="index.html">
                <img src="./assets/logo/LogoHuellitas/isotipo-512.png" alt="Veterinaria Huellitas">
                <span class="nombre-veterinaria">Veterinaria <em>Huellitas</em></span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
                    aria-expanded="false" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="institucional.html">Sobre Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="cobertura.html">Cobertura</a></li>
                    <li class="nav-item"><a class="nav-link" href="contactos.html">Contactos</a></li>
                    <li class="nav-item"><a class="nav-link" href="mascotas.html">Mascotas</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="veterinarios.html">Veterinarios</a></li>
                </ul>
            </div>

        </div>
    </nav>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container-fluid  px-4 py-5">

        <!-- Encabezado de Sección -->
        <div class="d-flex align-items-center justify-content-between mb-4 pb-2 border-bottom">
            <div>
                <span class="badge bg-secondary px-3 py-2 rounded-pill fw-semibold mb-2">PROFESIONALES</span>
                <h1 class="h2 fw-bold text-white mb-0">
                    Veterinarios Registrados
                    <span class="badge bg-secondary rounded-pill align-middle fs-6" id="total">0</span>
                </h1>
            </div>
        </div>

        <section class="row g-4 align-items-start">

            <!-- COLUMNA IZQUIERDA: TABLA DE VETERINARIOS -->
            <article class="col-12 col-lg-7">

                <!-- Buscador (opcional) -->
                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" id="buscador" class="form-control" placeholder="Buscar por nombre, matrícula o especialización">
                </div>

                <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-success text-success-emphasis">
                                    <tr>
                                        <th scope="col" class="ps-4">Matrícula</th>
                                        <th scope="col">Nombre</th>
                                        <th scope="col">Especialización</th>
                                        <th scope="col">Valor Consulta</th>
                                        <th scope="col" class="text-center pe-4">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="listado-veterinarios">
                                    <!-- Se renderiza dinámicamente con JavaScript -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </article>

            <!-- COLUMNA DERECHA: FORMULARIO -->
            <article class="col-12 col-lg-5">
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-4">
                        <div class="d-flex align-items-center mb-3">
                            <div class="bg-primary bg-opacity-10 text-primary p-2 rounded-3 me-3">
                                <i class="bi bi-person-plus fs-4"></i>
                            </div>
                            <h3 class="h5 mb-0 fw-bold text-dark" id="titulo-formulario">Nuevo Veterinario</h3>
                        </div>

                        <form class="d-flex flex-column gap-3" id="form-veterinario">
                            <!-- Campo oculto para almacenar el ID durante la edición -->
                            <input type="hidden" name="idVeterinario" id="idVeterinario">

                            <!-- Matrícula -->
                            <div class="form-floating">
                                <input class="form-control" type="number" name="matricula" id="matricula" min="1" step="1" placeholder="Matrícula" required>
                                <label for="matricula"><i class="bi bi-card-text me-1"></i> Matrícula</label>
                            </div>

                            <!-- Nombre -->
                            <div class="form-floating">
                                <input type="text" name="nombre" id="nombre" class="form-control" placeholder="Nombre del veterinario" required>
                                <label for="nombre"><i class="bi bi-person me-1"></i> Nombre y Apellido</label>
                            </div>

                            <!-- Especialización (lista de opciones predefinidas) -->
                            <div class="form-floating">
                                <select name="especializacion" id="especializacion" class="form-select" required>
                                    <option value="" selected disabled>Seleccioná una opción</option>
                                    <option value="Clínica general">Clínica general</option>
                                    <option value="Cirugía veterinaria">Cirugía veterinaria</option>
                                    <option value="Animales pequeños">Animales pequeños</option>
                                    <option value="Animales exóticos">Animales exóticos</option>
                                    <option value="Dermatología">Dermatología</option>
                                    <option value="Cardiología">Cardiología</option>
                                    <option value="Traumatología">Traumatología</option>
                                    <option value="Oftalmología">Oftalmología</option>
                                </select>
                                <label for="especializacion"><i class="bi bi-clipboard2-pulse me-1"></i> Especialización</label>
                            </div>

                            <!-- Valor de la consulta -->
                            <div class="form-floating">
                                <input class="form-control" type="number" name="valorConsulta" id="valorConsulta" min="0" step="0.01" placeholder="Ejemplo 15000" required>
                                <label for="valorConsulta"><i class="bi bi-cash me-1"></i> Valor de la Consulta ($)</label>
                            </div>

                            <!-- Botones -->
                            <div class="d-grid gap-2 mt-2">
                                <button id="botonAgregarVeterinario" class="btn btn-primary btn-lg fs-6 fw-semibold py-2" type="submit">
                                    <i class="bi bi-check-circle me-1"></i> Agregar Veterinario
                                </button>
                                <button id="botonCancelar" class="btn btn-outline-secondary d-none" type="button" onclick="cancelarEdicion()">
                                    Cancelar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </article>

        </section>
    </main>

    <!-- FOOTER -->
    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container text-center">
            <p class="mb-0 text-muted">&copy; 2026 Veterinaria Huellitas - Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- BOOTSTRAP JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- SCRIPTS DEL PROYECTO -->
    <script src="./js/storage.js"></script>
    <script src="./js/veterinarios.js"></script>
</body>
</html>
