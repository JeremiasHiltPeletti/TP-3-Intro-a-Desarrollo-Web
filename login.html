<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./css/bases.css">
    <link rel="stylesheet" href="./css/estilos.css">
    <title>Iniciar sesión - Veterinaria Huellitas</title>
    <script src="js/auth.js"></script>
</head>
<body>

<header>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-huellitas">
        <div class="container-fluid">

            <a class="navbar-brand Logo" href="index.html">
                <img src="./assets/logo/LogoHuellitas/isotipo-512.png" alt="Veterinaria Huellitas">
                <span class="nombre-veterinaria">Veterinaria <em>Huellitas</em></span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
                    aria-expanded="false" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="institucional.html">Sobre Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="cobertura.html">Cobertura</a></li>
                    <li class="nav-item d-none" data-admin><a class="nav-link" href="mascotas.html">Mascotas</a></li>
                    <li class="nav-item d-none" data-admin><a class="nav-link" href="veterinarios.html">Veterinarios</a></li>
                    <li class="nav-item d-none" data-admin><a class="nav-link" href="turnos.html">Turnos</a></li>
                    <li class="nav-item d-none" data-admin><a class="nav-link" href="historia.html">Historia Clínica</a></li>
                    <li class="nav-item"><a class="nav-link" href="contactos.html">Contactos</a></li>
                    <li class="nav-item" data-sin-sesion><a class="nav-link active" aria-current="page" href="login.html">Iniciar sesión</a></li>
                    <li class="nav-item d-none" data-admin><a class="nav-link" href="#" id="btnCerrarSesion">Cerrar sesión</a></li>
                </ul>
            </div>

        </div>
    </nav>
</header>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 fw-bold mb-1">Acceso de administradores</h1>
                    <p class="text-muted">Ingresá tus credenciales para gestionar el sistema.</p>

                    <!-- Muestra el mensaje si las credenciales son incorrectas -->
                    <div id="mensajeError" class="alert alert-danger d-none" role="alert"></div>

                    <form id="form-login" class="d-flex flex-column gap-3">
                        <div>
                            <label for="usuario" class="form-label">Usuario</label>
                            <input type="text" class="form-control" id="usuario" name="usuario"
                                   placeholder="Usuario" autocomplete="username" required>
                        </div>
                        <div>
                            <label for="clave" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="clave" name="clave"
                                   placeholder="Contraseña" autocomplete="current-password" required>
                        </div>
                        <button type="submit" id="botonLogin" class="btn btn-primary btn-lg fs-6 fw-semibold py-2">
                            Ingresar
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/login.js"></script>
</body>
</html>
