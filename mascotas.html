<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mascotas - Veterinaria Huellitas</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons (Para mejorar el aspecto visual) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="./css/bases.css">
    <link rel="stylesheet" href="./css/estilos.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- NAV BAR -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark navbar-huellitas">
        <div class="container-fluid">

            <a class="navbar-brand Logo" href="index.html">
                <img src="./assets/logo/LogoHuellitas/isotipo-512.png" alt="Veterinaria Huellitas">
                <span class="nombre-veterinaria">Veterinaria <em>Huellitas</em></span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
                    aria-expanded="false" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="institucional.html">Sobre Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="cobertura.html">Cobertura</a></li>
                    <li class="nav-item"><a class="nav-link" href="contactos.html">Contactos</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="mascotas.html">Mascotas</a></li>
                    <li class="nav-item"><a class="nav-link" href="veterinarios.html">Veterinarios</a></li>
                </ul>
            </div>

        </div>
    </nav>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container-fluid  px-4 py-5">
        
        <!-- Encabezado de Sección -->
        <div class="d-flex align-items-center justify-content-between mb-4 pb-2 border-bottom">
            <div>
                <span class="badge bg-secondary px-3 py-2 rounded-pill fw-semibold mb-2">PACIENTES</span>
                <h1 class="h2 fw-bold text-white mb-0">
                    Mascotas Registradas 
                    <span class="badge bg-secondary rounded-pill align-middle fs-6" id="total">0</span>
                </h1>
            </div>
        </div>

        <section class="row g-4 align-items-start">
            
            <!-- COLUMNA IZQUIERDA: TABLA DE MASCOTAS -->
            <article class="col-12 col-lg-7">
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-success text-success-emphasis">
                                    <tr>
                                        <th scope="col" class="ps-4">Dueño</th>
                                        <th scope="col">Mascota</th>
                                        <th scope="col">Color</th>
                                        <th scope="col">Edad</th>
                                        <th scope="col">Peso</th>
                                        <th scope="col" class="text-center pe-4">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="listado-mascotas">
                                    <!-- Se renderiza dinámicamente con JavaScript -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </article>

            <!-- COLUMNA DERECHA: FORMULARIO -->
            <article class="col-12 col-lg-5">
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-4">
                        <div class="d-flex align-items-center mb-3">
                            <div class="bg-primary bg-opacity-10 text-primary p-2 rounded-3 me-3">
                                <i class="bi bi-patch-plus fs-4"></i>
                            </div>
                            <h3 class="h5 mb-0 fw-bold text-dark" id="titulo-formulario">Nueva Mascota</h3>
                        </div>

                        <form class="d-flex flex-column gap-3" id="form-mascota">
                            <!-- Campo oculto para almacenar el ID durante la edición -->
                            <input type="hidden" name="idMascota" id="idMascota">

                            <!-- Dueño -->
                            <div class="form-floating">
                                <input type="text" name="nombreDuenio" id="nombreDuenio" class="form-control" placeholder="Nombre del dueño" required>
                                <label for="nombreDuenio"><i class="bi bi-person me-1"></i> Dueño</label>
                            </div>

                            <!-- Nombre Mascota -->
                            <div class="form-floating">
                                <input type="text" name="nombreMascota" id="nombreMascota" class="form-control" placeholder="Nombre de la mascota" required>
                                <label for="nombreMascota"><i class="bi bi-heart-pulse me-1"></i> Nombre de la Mascota</label>
                            </div>

                            <!-- Color -->
                            <div class="form-floating">
                                <input type="text" name="color" id="color" class="form-control" placeholder="Color" required>
                                <label for="color"><i class="bi bi-palette me-1"></i> Color</label>
                            </div>

                            <!-- Edad y Peso en dos columnas si hay espacio -->
                            <div class="row g-2">
                                <div class="col-6">
                                    <div class="form-floating">
                                        <input class="form-control" type="number" name="edad" id="edad" min="0" max="30" placeholder="Edad" required>
                                        <label for="edad">Edad (años)</label>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="form-floating">
                                        <input class="form-control" type="number" name="peso" id="peso" min="0" step="0.01" placeholder="Ejemplo 4.5" required>
                                        <label for="peso">Peso (kg)</label>
                                    </div>
                                </div>
                            </div>

                            <!-- Botones -->
                            <div class="d-grid gap-2 mt-2">
                                <button id="botonAgregarMascota" class="btn btn-primary btn-lg fs-6 fw-semibold py-2" type="submit">
                                    <i class="bi bi-check-circle me-1"></i> Agregar Mascota
                                </button>
                                <button id="botonCancelar" class="btn btn-outline-secondary d-none" type="button" onclick="cancelarEdicion()">
                                    Cancelar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </article>

        </section>
    </main>

    <!-- FOOTER -->
    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container text-center">
            <p class="mb-0 text-muted">&copy; 2026 Veterinaria Huellitas - Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- BOOTSTRAP JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- SCRIPTS DEL PROYECTO -->
    <script src="./js/storage.js"></script>
    <script src="./js/mascotas.js"></script>
</body>
</html>
